<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Uređivanje menija</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Text marked with data-i18n* is filled in from strings.js in the chosen language. -->
  <div id="screen-loading" class="center-screen"><div class="spinner"></div></div>

  <!-- Shown on the live site until this device has a GitHub access token -->
  <section id="screen-connect" class="center-screen" hidden>
    <form id="connect-form" class="panel connect">
      <div class="connect-head">
        <h1 data-i18n="connectTitle">Uređivanje menija</h1>
        <button type="button" class="lang-switch" data-i18n-aria="switchLang"></button>
      </div>
      <p class="lead" data-i18n="connectLead"></p>
      <div class="field-row">
        <label class="field"><span data-i18n="ghUser"></span><input id="c-owner" required autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <label class="field"><span data-i18n="repoName"></span><input id="c-repo" required autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      </div>
      <label class="field"><span data-i18n="token"></span><input id="c-token" type="password" required autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
      <details class="help">
        <summary data-i18n="tokenHelp"></summary>
        <ol>
          <li data-i18n-html="tokenStep1"></li>
          <li data-i18n-html="tokenStep2"></li>
          <li data-i18n-html="tokenStep3"></li>
          <li data-i18n-html="tokenStep4"></li>
          <li data-i18n-html="tokenStep5"></li>
        </ol>
      </details>
      <details class="help">
        <summary data-i18n="advanced"></summary>
        <label class="field"><span data-i18n="branch"></span><input id="c-branch" value="main" autocapitalize="off" spellcheck="false"></label>
      </details>
      <p id="connect-error" class="error" hidden></p>
      <button class="btn primary block" type="submit" data-i18n="connect"></button>
    </form>
  </section>

  <div id="screen-main" hidden>
    <header class="topbar">
      <div class="topbar-title">
        <strong id="cafe-name"></strong>
        <span id="mode-badge" class="badge"></span>
      </div>
      <div class="btn-row nowrap">
        <button type="button" class="lang-switch" data-i18n-aria="switchLang"></button>
        <a id="view-link" class="btn ghost sm" href="../" target="_blank" rel="noopener" data-i18n="viewMenu"></a>
      </div>
    </header>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="menu" role="tab" data-i18n="tabMenu"></button>
      <button class="tab" data-tab="settings" role="tab" data-i18n="tabInfo"></button>
    </nav>

    <main class="content">
      <section id="tab-menu"></section>

      <section id="tab-settings" hidden>
        <form id="settings-form" class="settings" autocomplete="off">
          <div class="panel">
            <h2 data-i18n="secCafe"></h2>
            <label class="field"><span data-i18n="name"></span><input name="name" required></label>
            <label class="field"><span data-i18n="tagline"></span><input name="tagline" data-i18n-ph="taglinePlaceholder"></label>
            <label class="field en-only"><span data-i18n="taglineEn"></span><input name="taglineEn" lang="en"></label>
            <div class="field">
              <span data-i18n="logo"></span>
              <div class="logo-row">
                <div id="logo-preview" class="logo-preview"></div>
                <label class="btn sm"><span data-i18n="chooseImage"></span><input id="logo-file" type="file" accept="image/*" hidden></label>
                <button id="logo-remove" class="btn ghost sm" type="button" data-i18n="remove"></button>
              </div>
            </div>
            <div class="field" id="theme-field" hidden>
              <span data-i18n="design"></span>
              <select name="theme" id="theme-select"></select>
            </div>
            <div class="field">
              <span data-i18n="brandColor"></span>
              <div class="color-row">
                <label class="check"><input type="checkbox" id="accent-on"> <span data-i18n="useOwnColor"></span></label>
                <input type="color" id="accent-color" value="#b5651d">
              </div>
              <small data-i18n="brandHint"></small>
            </div>
          </div>

          <div class="panel">
            <h2 data-i18n="secLanguages"></h2>
            <label class="check"><input type="checkbox" id="english-on"> <span data-i18n="englishOn"></span></label>
            <p class="hint" data-i18n="englishHint"></p>
          </div>

          <div class="panel">
            <h2 data-i18n="secPrices"></h2>
            <div class="field-row">
              <label class="field"><span data-i18n="currency"></span><input name="currency" placeholder="RSD, din., €…"></label>
              <label class="field"><span data-i18n="currencyPos"></span>
                <select name="currencyPosition"><option value="after" data-i18n="currencyAfter"></option><option value="before" data-i18n="currencyBefore"></option></select>
              </label>
            </div>
            <div class="field-row">
              <label class="field"><span data-i18n="decimals"></span>
                <select name="priceDecimals"><option value="2" data-i18n="decimalsTwo"></option><option value="0" data-i18n="decimalsNone"></option></select>
              </label>
              <label class="field"><span data-i18n="decimalSep"></span>
                <select name="decimalSeparator"><option value="," data-i18n="sepComma"></option><option value="." data-i18n="sepDot"></option></select>
              </label>
            </div>
            <p class="hint"><span data-i18n="example"></span> <strong id="price-example"></strong></p>
          </div>

          <div class="panel">
            <h2 data-i18n="secContact"></h2>
            <label class="field"><span data-i18n="address"></span><input name="address"></label>
            <label class="field"><span data-i18n="phone"></span><input name="phone" type="tel"></label>
            <label class="field"><span data-i18n="hours"></span><textarea name="hours" rows="3" data-i18n-ph="hoursPlaceholder"></textarea></label>
            <label class="field en-only"><span data-i18n="hoursEn"></span><textarea name="hoursEn" rows="3" lang="en" placeholder="Mon–Fri 08:00–22:00"></textarea></label>
            <div class="field-row">
              <label class="field"><span data-i18n="wifiName"></span><input name="wifiName"></label>
              <label class="field"><span data-i18n="wifiPassword"></span><input name="wifiPassword"></label>
            </div>
            <label class="field"><span>Instagram</span><input name="instagram" data-i18n-ph="instagramPlaceholder" autocapitalize="off"></label>
            <label class="field"><span data-i18n="note"></span><textarea name="note" rows="2" data-i18n-ph="notePlaceholder"></textarea></label>
            <label class="field en-only"><span data-i18n="noteEn"></span><textarea name="noteEn" rows="2" lang="en" placeholder="e.g. All prices include VAT."></textarea></label>
          </div>

          <div class="panel">
            <h2 data-i18n="secDevice"></h2>
            <p id="connection-info" class="hint"></p>
            <button id="disconnect" class="btn ghost sm" type="button" hidden data-i18n="disconnect"></button>
          </div>
        </form>
      </section>
    </main>

    <div id="savebar" class="savebar" hidden>
      <span data-i18n="unsaved"></span>
      <div class="btn-row">
        <button id="discard" class="btn ghost" type="button" data-i18n="discard"></button>
        <button id="publish" class="btn primary" type="button" data-i18n="publish"></button>
      </div>
    </div>
  </div>

  <dialog id="item-dialog" class="dialog">
    <form id="item-form" novalidate>
      <header class="dialog-head">
        <h2 id="item-dialog-title"></h2>
        <button class="icon-btn" type="button" data-close data-i18n-aria="close">×</button>
      </header>
      <div class="dialog-body">
        <div class="photo-field">
          <div id="f-photo" class="photo"></div>
          <div class="btn-row">
            <label class="btn sm"><span data-i18n="choosePhoto"></span><input id="f-file" type="file" accept="image/*" hidden></label>
            <button id="f-photo-remove" class="btn ghost sm" type="button" data-i18n="removePhoto"></button>
          </div>
        </div>
        <label class="field"><span data-i18n="name"></span><input id="f-name" required maxlength="80"></label>
        <label class="field"><span data-i18n="description"></span><textarea id="f-desc" rows="3" maxlength="400"></textarea></label>
        <fieldset class="en-group en-only">
          <legend data-i18n="inEnglish"></legend>
          <label class="field"><span data-i18n="nameEn"></span><input id="f-name-en" maxlength="80" lang="en"></label>
          <label class="field"><span data-i18n="descriptionEn"></span><textarea id="f-desc-en" rows="3" maxlength="400" lang="en"></textarea></label>
          <small class="hint" data-i18n="inEnglishHint"></small>
        </fieldset>
        <div class="field-row">
          <label class="field"><span data-i18n="price"></span>
            <span class="suffix-input"><input id="f-price" inputmode="decimal" placeholder="0"><span id="f-currency" class="suffix"></span></span>
          </label>
          <div class="field">
            <label for="f-size" data-i18n="size"></label>
            <div class="unit-row">
              <input id="f-size" inputmode="decimal" data-i18n-ph="sizePlaceholder">
              <select id="f-unit" data-i18n-aria="unit">
                <option value="">—</option>
                <option value="ml">ml</option>
                <option value="l">l</option>
                <option value="g">g</option>
                <option value="kg">kg</option>
                <option value="kom" data-i18n="unitPcs"></option>
                <option value="cm">cm</option>
              </select>
            </div>
          </div>
        </div>
        <label class="field"><span data-i18n="section"></span><select id="f-cat"></select></label>
        <div class="field"><span data-i18n="labels"></span><div id="f-tags" class="tag-picker"></div></div>
        <label class="check big"><input type="checkbox" id="f-available"> <span data-i18n="availableLong"></span></label>
      </div>
      <footer class="dialog-foot">
        <button id="item-delete" class="btn danger ghost" type="button" data-i18n="delete"></button>
        <span class="spacer"></span>
        <button class="btn ghost" type="button" data-close data-i18n="cancel"></button>
        <button class="btn primary" type="submit" data-i18n="done"></button>
      </footer>
    </form>
  </dialog>

  <dialog id="cat-dialog" class="dialog small">
    <form id="cat-form" novalidate>
      <header class="dialog-head">
        <h2 id="cat-dialog-title"></h2>
        <button class="icon-btn" type="button" data-close data-i18n-aria="close">×</button>
      </header>
      <div class="dialog-body">
        <label class="field"><span data-i18n="sectionName"></span><input id="s-name" required maxlength="60" data-i18n-ph="sectionPlaceholder"></label>
        <label class="field"><span data-i18n="sectionDesc"></span><input id="s-desc" maxlength="160"></label>
        <fieldset class="en-group en-only">
          <legend data-i18n="inEnglish"></legend>
          <label class="field"><span data-i18n="sectionName"></span><input id="s-name-en" maxlength="60" lang="en" placeholder="e.g. Coffee"></label>
          <label class="field"><span data-i18n="sectionDesc"></span><input id="s-desc-en" maxlength="160" lang="en"></label>
        </fieldset>
      </div>
      <footer class="dialog-foot">
        <button id="cat-delete" class="btn danger ghost" type="button" data-i18n="delete"></button>
        <span class="spacer"></span>
        <button class="btn ghost" type="button" data-close data-i18n="cancel"></button>
        <button class="btn primary" type="submit" data-i18n="done"></button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../core/common.js"></script>
  <script src="strings.js"></script>
  <script src="admin.js"></script>
</body>
</html>
